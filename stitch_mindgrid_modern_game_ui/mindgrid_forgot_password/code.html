<body class="bg-surface text-on-surface antialiased">
<!-- Gradient Background Layer -->
<div class="fixed inset-0 z-0 bg-gradient-to-br from-primary-fixed via-surface to-surface-container-high opacity-60"></div>
<!-- Hero Image Background Overlay -->
<div class="fixed inset-0 z-1 opacity-20 overflow-hidden">
<img class="w-full h-full object-cover" data-alt="An abstract, ethereal background featuring flowing gradients of soft indigo and vibrant purple light. The composition is clean and minimalist, with smooth curves that suggest a sense of mental clarity and high-end digital polish. Subtle particles of light drift through the space, creating a dreamlike, premium atmosphere consistent with a modern gaming interface designed for focus and relaxation." src="https://lh3.googleusercontent.com/aida-public/AB6AXuClBoy2ewURKJHZr47IM8kaMUfKJe-x49gZQSgJoQbNm9kILP9QLC22T0294O2eCptfqswhva8In2Qr1d0ZABENkuOlG97Dauk4MR07pXFs6eTVYBe5soLorPJ0xrTJ6ya52BXqkOKovhdaN2eM-ltxIPrB_H--Ax-A-tnrAU3UxC9isJrdjxlfEioK7STsMtsazUdjiSP-WbsbvZaN8kQ0XlLBGOeZm9dlDr3hhjHPC-F0kRJ7jeAyu8N1PHypfZkWHyPmvz-n74W7"/>
</div>
<!-- Main Content Container -->
<main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-margin-mobile">
<!-- Brand Identification -->
<div class="mb-12 flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-primary/20 border border-white/20">
<span class="material-symbols-outlined text-white text-4xl" data-weight="fill">grid_view</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">MindGrid</h1>
</div>
<!-- Glassmorphic Forgot Password Card -->
<section class="glass-card soft-diffusion w-full max-w-md rounded-lg p-8 flex flex-col gap-6">
<header class="text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Reset Password</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant px-4">
                    Enter your email to receive a reset link
                </p>
</header>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<!-- Email Input Group -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-white/50 border border-outline-variant/30 rounded-full focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all placeholder:text-outline font-body-sm text-body-sm shadow-sm" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 bg-gradient-to-b from-primary-container to-primary text-white rounded-full font-headline-md text-body-lg inner-glow shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Additional Help -->
<div class="flex flex-col items-center gap-4 mt-2">
<a class="font-body-sm text-body-sm text-primary font-bold hover:underline underline-offset-4 decoration-primary/30 flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-base">arrow_back</span>
                    Back to Login
                </a>
</div>
</section>
<!-- Decorative Floating Chips -->
<div class="mt-12 flex gap-3">
<div class="glass-card px-4 py-2 rounded-full border border-primary/20 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Secure Reset</span>
</div>
<div class="glass-card px-4 py-2 rounded-full border border-primary/20 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Instant Delivery</span>
</div>
</div>
</main>
<!-- Footer Decoration -->
<footer class="fixed bottom-8 left-0 w-full text-center z-10 px-gutter">
<p class="font-label-caps text-label-caps text-outline uppercase tracking-widest">
            Mental Clarity Through Focus
        </p>
</footer>
