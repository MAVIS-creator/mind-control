<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>

            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #e2dfff 0%, #f9f9ff 40%, #d4e3ff 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(53, 37, 205, 0.05);
        }
        .inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
        }
        .avatar-scroll::-webkit-scrollbar {
            display: none;
        }
        .avatar-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col items-center justify-center p-gutter">
<main class="w-full max-w-md space-y-8 pb-10">
<!-- Header Branding (Suppressed Nav for Transactional Flow) -->
<div class="flex flex-col items-center text-center space-y-2 mb-10">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">MindGrid</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Connect to Clarity</p>
</div>
<!-- Main Glass Card Container -->
<section class="glass-card rounded-lg p-6 space-y-8">
<header>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Join the Grid</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Start your journey toward mental mastery today.</p>
</header>
<!-- Avatar Selection Grid/Carousel -->
<div class="space-y-4">
<label class="font-label-caps text-label-caps text-primary">CHOOSE YOUR AVATAR</label>
<div class="flex gap-4 overflow-x-auto pb-4 avatar-scroll snap-x">
<div class="flex-shrink-0 w-20 h-20 rounded-full border-4 border-primary p-1 snap-center bg-white shadow-sm">

</div>
<div class="flex-shrink-0 w-20 h-20 rounded-full border-2 border-outline-variant p-1 snap-center opacity-60 hover:opacity-100 transition-opacity">
<img alt="Avatar" class="w-full h-full rounded-full" data-alt="A charming and sleek 3D avatar of a stylized character with tech-inspired details, presented in a clean digital art style. The color palette features cool blues and subtle lavender gradients, consistent with a premium gaming interface. The character is rendered with soft edges and smooth surfaces, conveying a sense of playfulness and mental clarity in a professional UI context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuATFwGQfMI-p9Y-MOXXxEKvGomQYMfVrLpkRsLAgofpe_MMWvDVBTDMWG2K6NiFMB6BTNcH2GO0MmylZkgk1cUIjE157RMznme0v3oS6BF68co6ZRG3Bcp1lDa5i4j20RrE5ua93l757TuzvJ2Coa65zzTCgRHMjaeZUiOzFNvZMgnZEyvt_QPDIIONwMSPYVznY6P8YG1TFhUSskDb2xSFhE-2eP5X74kK3y7d0mOogRWAzo2b1wbrbF2ZUqNn7LlRw8GJs6Ok4KZi"/>
</div>
<div class="flex-shrink-0 w-20 h-20 rounded-full border-2 border-outline-variant p-1 snap-center opacity-60 hover:opacity-100 transition-opacity">
<img alt="Avatar" class="w-full h-full rounded-full" data-alt="A cute, futuristic 3D character avatar with large expressive features, designed for a modern casual gaming platform. The visual style is high-gloss and minimal, utilizing translucent glass effects and a soft purple aesthetic. The lighting creates gentle shadows that give the character a tactile, touchable feel within a bright, minimalist digital environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgUHYw5SbU5CCntf1xwc6hWNSs4QlbcBxJaF6iainKmAkD2oWL5X23ojOZYVyOmJxCl4Gj0GzVQO8bEDP2RG3o3aDDAfkllFLNJfyfYgk2qCri8j_BSKbt-xNJ8i5hftsfEArEk4PdeM2XF_Q56v0wmevClw8LAzZXwlBNvtkNhX3-yv2jFQdShX5pTAzzwEXptcH9Yu-KTBpKTz7wei9ShMDgQ6bw3gLiHN2WGgMtJ4TvmJ_-2F53pfwGCyvbL8t5EkCPrmBbdXQG"/>
</div>
<div class="flex-shrink-0 w-20 h-20 rounded-full border-2 border-outline-variant p-1 snap-center opacity-60 hover:opacity-100 transition-opacity">
<img alt="Avatar" class="w-full h-full rounded-full" data-alt="A premium 3D character design with a minimalist aesthetic, featuring a soft color palette of indigo and off-white. The character looks modern and frictionless, fitting perfectly into an Apple-inspired design system for cognitive games. Soft ambient occlusion and high-quality shaders make the avatar feel high-end and polished against the light-mode UI background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaks1JgdbPi7oJbtm6B7bywUU6MNkr5DJI5rPDgewpnrwsa70QIQyWv7bg84NTFJjdWjZOPWnKhx-B-tthV1kfsvhM4rwcfNAB9ptG55ExELD57m4ZTawLpB4oqy-tTANg_q6K7IUnkczUkghk69FcEWfIT7dSNcnm9-RnjNob_Pr5KpQGpDd8L60NQ3qbQo58H-xQZV0l7jyngQ0ZGW0WWJX-wiVRXAM7kVKMS4wPFx3eyTVb09UBJPmPhc85n0A8OaSf6sn25QyZ"/>
</div>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-6">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="username">
<span class="material-symbols-outlined text-[16px]">person</span>
                        USERNAME
                    </label>
<input class="w-full bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 rounded-md py-4 px-4 font-body-sm text-on-surface placeholder-outline transition-all" id="username" placeholder="Enter your grid name" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="email">
<span class="material-symbols-outlined text-[16px]">mail</span>
                        EMAIL ADDRESS
                    </label>
<input class="w-full bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 rounded-md py-4 px-4 font-body-sm text-on-surface placeholder-outline transition-all" id="email" placeholder="example@mindgrid.com" type="email"/>
</div>
<div class="space-y-2 relative">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[16px]">lock</span>
                        PASSWORD
                    </label>
<input class="w-full bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 rounded-md py-4 px-4 font-body-sm text-on-surface placeholder-outline transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 bottom-4 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex items-center gap-3 py-2">
<input class="rounded border-outline-variant text-primary focus:ring-primary/30" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                        I agree to the <span class="text-primary font-bold">Terms of Service</span>
</label>
</div>
</form>
</section>
<!-- Primary Action -->
<div class="space-y-4 pt-4">
<button class="w-full bg-gradient-to-b from-primary to-primary-container text-white py-5 rounded-lg font-headline-md text-headline-md shadow-lg shadow-primary/20 inner-glow active:scale-95 transition-transform duration-200">
                Create Account
            </button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? <span class="text-primary font-bold cursor-pointer hover:underline">Sign In</span>
</p>
</div>
</main>
<!-- Social Proof/Footer Section -->
<footer class="w-full max-w-md px- gutter mt-auto mb-6 text-center">
<div class="flex justify-center gap-6 opacity-40">
<span class="material-symbols-outlined text-on-surface">security</span>
<span class="material-symbols-outlined text-on-surface">lock_open</span>
<span class="material-symbols-outlined text-on-surface">verified_user</span>
</div>
<p class="font-label-caps text-[10px] text-on-surface-variant mt-4 opacity-50">ENCRYPTED GRID PROTOCOL V.2.0.4</p>
</footer>
</body></html>
